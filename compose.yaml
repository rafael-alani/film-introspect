services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_PATH: /data/introspect.db
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to at least 32 random characters}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-false}
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-false}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      META_EGG_URL: ${META_EGG_URL:-}
      META_EGG_TIMEOUT_MS: ${META_EGG_TIMEOUT_MS:-65000}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      JELLYFIN_POLL_INTERVAL_MS: ${JELLYFIN_POLL_INTERVAL_MS:-10000}
      BAZARR_URL: ${BAZARR_URL:-}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - introspect_data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  introspect_data:
